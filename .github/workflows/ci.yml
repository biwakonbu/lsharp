name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチ/PR の重複実行をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  lint:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  format:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # P8-9: ブートストラップ CI
  # selfhost モジュールの stage1 コンパイル成功を検証
  bootstrap:
    name: Bootstrap (selfhost)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Phase 11 fixed input set のコンパイル検証
        env:
          RUN_BOOTSTRAP_FIXED_POINT: 1
          BOOTSTRAP_DIFF_ARTIFACT_ID: ${{ github.sha }}
        run: bash scripts/ci/compile-phase11-inputs.sh
      - name: Bootstrap diff artifact 保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-diff-${{ github.sha }}
          path: ci-artifacts/bootstrap-diff/${{ github.sha }}/
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 30 }}
          if-no-files-found: ignore

  # OPS-05: ビルド済み lsharp バイナリ経路（cargo run に依存しない smoke）
  default-path-smoke:
    name: Default path (lsharp binary)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: default-path-smoke.sh
        run: bash scripts/ci/default-path-smoke.sh

  # OPS-07b: release-style archive を workflow 内 artifact として作る
  fresh-clone-artifact:
    name: Fresh clone artifact
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release-style archive
        shell: bash
        env:
          VERSION: ci-${{ github.sha }}
        run: rm -rf dist && bash scripts/release.sh
      - name: artifact 保存
        uses: actions/upload-artifact@v4
        with:
          name: fresh-clone-archive-${{ github.sha }}
          path: dist/*.tar.gz
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 30 }}
          if-no-files-found: error

  # OPS-07b: downloaded artifact を Rust toolchain 無しで binary-only smoke する
  test-fresh-clone:
    name: Test fresh clone (binary-only)
    runs-on: ubuntu-latest
    needs: [fresh-clone-artifact]
    steps:
      - uses: actions/checkout@v4
      - name: dist/ を初期化
        run: rm -rf dist && mkdir -p dist
      - name: build 済み artifact のダウンロード
        uses: actions/download-artifact@v4
        with:
          name: fresh-clone-archive-${{ github.sha }}
          path: dist/
      - name: test-fresh-clone.sh
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "ERROR: no fresh-clone archives found under dist/" >&2
            exit 1
          fi

          for archive in "${archives[@]}"; do
            bash scripts/ci/test-fresh-clone.sh "$archive"
          done

  # OPS-07a: Rust 依存のまま clean checkout 由来のビルド経路を smoke する
  fresh-clone-smoke:
    name: Fresh clone smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test-fresh-clone.sh
        run: bash scripts/ci/test-fresh-clone.sh

  gc-metrics-artifact:
    name: GC metrics artifact
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: collect-gc-metrics.sh
        run: bash scripts/ci/collect-gc-metrics.sh
      - name: artifact 保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-metrics-${{ github.sha }}
          path: ci-artifacts/gc-metrics/${{ github.sha }}/summary.json
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 30 }}

  # Phase 14: エディタ拡張のビルド検証
  editor-extension-build:
    name: Editor Extension Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: VS Code 拡張のビルド検証
        working-directory: editors/vscode
        run: |
          npm install
          npm run compile
      - name: Claude Code plugin.json の検証
        run: |
          python3 -c "import json; json.load(open('editors/claude-code/.claude-plugin/plugin.json'))"
          echo "plugin.json: valid JSON"

  # P11-1: ドキュメント監査
  audit-docs:
    name: Audit Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ドキュメント監査の実行
        run: bash scripts/audit_docs.sh

  # 全ジョブの成功を集約するゲートジョブ
  # Branch Protection Rules ではこのジョブだけを required にすればよい
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test, lint, format, bootstrap, audit-docs, default-path-smoke, test-fresh-clone, fresh-clone-smoke, gc-metrics-artifact, editor-extension-build]
    if: always()
    steps:
      - name: 全ジョブの結果を検証
        run: |
          if [[ "${{ needs.test.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.format.result }}" != "success" ||
                "${{ needs.bootstrap.result }}" != "success" ||
                "${{ needs.audit-docs.result }}" != "success" ||
                "${{ needs.default-path-smoke.result }}" != "success" ||
                "${{ needs.test-fresh-clone.result }}" != "success" ||
                "${{ needs.fresh-clone-smoke.result }}" != "success" ||
                "${{ needs.gc-metrics-artifact.result }}" != "success" ||
                "${{ needs.editor-extension-build.result }}" != "success" ]]; then
            echo "CI failed: test=${{ needs.test.result }}, lint=${{ needs.lint.result }}, format=${{ needs.format.result }}, bootstrap=${{ needs.bootstrap.result }}, audit-docs=${{ needs.audit-docs.result }}, default-path-smoke=${{ needs.default-path-smoke.result }}, test-fresh-clone=${{ needs.test-fresh-clone.result }}, fresh-clone-smoke=${{ needs.fresh-clone-smoke.result }}, gc-metrics-artifact=${{ needs.gc-metrics-artifact.result }}, editor-extension-build=${{ needs.editor-extension-build.result }}"
            exit 1
          fi
          echo "All checks passed."

  # P11: gate-v2 -- 全ジョブ + shadow oracle を含む強化版ゲート
  ci-gate-v2:
    name: CI Gate v2
    runs-on: ubuntu-latest
    needs: [test, lint, format, bootstrap, audit-docs, default-path-smoke, test-fresh-clone, fresh-clone-smoke, gc-metrics-artifact, shadow-oracle, editor-extension-build]
    if: always()
    steps:
      - name: gate-v2 全ジョブの結果を検証
        run: |
          echo "test=${{ needs.test.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "format=${{ needs.format.result }}"
          echo "bootstrap=${{ needs.bootstrap.result }}"
          echo "audit-docs=${{ needs.audit-docs.result }}"
          echo "default-path-smoke=${{ needs.default-path-smoke.result }}"
          echo "test-fresh-clone=${{ needs.test-fresh-clone.result }}"
          echo "fresh-clone-smoke=${{ needs.fresh-clone-smoke.result }}"
          echo "gc-metrics-artifact=${{ needs.gc-metrics-artifact.result }}"
          echo "shadow-oracle=${{ needs.shadow-oracle.result }}"
          echo "editor-extension-build=${{ needs.editor-extension-build.result }}"
          if [[ "${{ needs.test.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.format.result }}" != "success" ||
                "${{ needs.bootstrap.result }}" != "success" ||
                "${{ needs.audit-docs.result }}" != "success" ||
                "${{ needs.default-path-smoke.result }}" != "success" ||
                "${{ needs.test-fresh-clone.result }}" != "success" ||
                "${{ needs.fresh-clone-smoke.result }}" != "success" ||
                "${{ needs.gc-metrics-artifact.result }}" != "success" ||
                "${{ needs.editor-extension-build.result }}" != "success" ]]; then
            echo "CI Gate v2 failed (required jobs)"
            exit 1
          fi
          # shadow-oracle は continue-on-error なので警告のみ
          if [[ "${{ needs.shadow-oracle.result }}" != "success" ]]; then
            echo "WARNING: shadow-oracle did not succeed (non-blocking)"
          fi
          echo "CI Gate v2: All checks passed."
      - name: artifact 保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-v2-results
          path: /tmp/ci-results-*.txt
          retention-days: 30
          if-no-files-found: ignore

  # P11: shadow/oracle ジョブ -- selfhost コンパイラと Rust コンパイラの出力を比較
  shadow-oracle:
    name: Shadow Oracle (differential test)
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: shadow/oracle differential テスト
        run: |
          echo "=== Shadow Oracle: selfhost vs Rust コンパイラ出力比較 ==="
          # selfhost モジュールの Wasm バイナリを生成して比較
          PASS=0
          FAIL=0
          for module in Token AST IR Type; do
            echo "--- ${module} ---"
            if cargo run -- compile selfhost/${module}.ls -o /tmp/shadow_${module}.wasm 2>/dev/null; then
              echo "PASS: ${module} コンパイル成功"
              PASS=$((PASS + 1))
            else
              echo "FAIL: ${module} コンパイル失敗"
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "Shadow Oracle 結果: PASS=$PASS, FAIL=$FAIL"
          # allowlist の確認
          if [[ -f tests/differential-allowlist.yaml ]]; then
            echo "differential-allowlist.yaml を確認済み"
          fi
      - name: artifact 保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-oracle-results
          path: /tmp/shadow_*.wasm
          retention-days: 14
          if-no-files-found: ignore
