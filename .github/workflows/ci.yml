name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチ/PR の重複実行をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  lint:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  format:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # P8-9: ブートストラップ CI
  # selfhost モジュールの stage1 コンパイル成功を検証
  bootstrap:
    name: Bootstrap (selfhost)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: selfhost モジュールのコンパイル検証
        run: |
          # Main.ls を除く selfhost モジュールは bootstrap gate として必須化する
          for module in Token AST IR Type TypeScheme Compiler WasmEmit Lexer Parser; do
            echo "=== Compiling selfhost/${module}.ls ==="
            cargo run -- compile selfhost/${module}.ls -o /tmp/${module}.wasm
          done
          echo "Bootstrap check complete."
      - name: selfhost Main.ls の既知 blocker 監視
        continue-on-error: true
        run: |
          echo "=== Compiling selfhost/Main.ls ==="
          cargo run -- compile selfhost/Main.ls -o /tmp/Main.wasm
      - name: stdlib コンパイル監視
        continue-on-error: true
        run: |
          for module in Core Char Debug IO List Map Path Set String Vector Json; do
            echo "=== Compiling stdlib/${module}.ls ==="
            cargo run -- compile stdlib/${module}.ls -o /tmp/stdlib_${module}.wasm
          done
          echo "stdlib monitor complete."

  # P11-1: ドキュメント監査
  audit-docs:
    name: Audit Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ドキュメント監査の実行
        run: bash scripts/audit_docs.sh

  # 全ジョブの成功を集約するゲートジョブ
  # Branch Protection Rules ではこのジョブだけを required にすればよい
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test, lint, format, bootstrap, audit-docs]
    if: always()
    steps:
      - name: 全ジョブの結果を検証
        run: |
          if [[ "${{ needs.test.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.format.result }}" != "success" ||
                "${{ needs.bootstrap.result }}" != "success" ||
                "${{ needs.audit-docs.result }}" != "success" ]]; then
            echo "CI failed: test=${{ needs.test.result }}, lint=${{ needs.lint.result }}, format=${{ needs.format.result }}, bootstrap=${{ needs.bootstrap.result }}, audit-docs=${{ needs.audit-docs.result }}"
            exit 1
          fi
          echo "All checks passed."

  # P11: gate-v2 -- 全ジョブ + shadow oracle を含む強化版ゲート
  ci-gate-v2:
    name: CI Gate v2
    runs-on: ubuntu-latest
    needs: [test, lint, format, bootstrap, audit-docs, shadow-oracle]
    if: always()
    steps:
      - name: gate-v2 全ジョブの結果を検証
        run: |
          echo "test=${{ needs.test.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "format=${{ needs.format.result }}"
          echo "bootstrap=${{ needs.bootstrap.result }}"
          echo "audit-docs=${{ needs.audit-docs.result }}"
          echo "shadow-oracle=${{ needs.shadow-oracle.result }}"
          if [[ "${{ needs.test.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.format.result }}" != "success" ||
                "${{ needs.bootstrap.result }}" != "success" ||
                "${{ needs.audit-docs.result }}" != "success" ]]; then
            echo "CI Gate v2 failed (required jobs)"
            exit 1
          fi
          # shadow-oracle は continue-on-error なので警告のみ
          if [[ "${{ needs.shadow-oracle.result }}" != "success" ]]; then
            echo "WARNING: shadow-oracle did not succeed (non-blocking)"
          fi
          echo "CI Gate v2: All checks passed."
      - name: artifact 保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-v2-results
          path: /tmp/ci-results-*.txt
          retention-days: 30
          if-no-files-found: ignore

  # P11: shadow/oracle ジョブ -- selfhost コンパイラと Rust コンパイラの出力を比較
  shadow-oracle:
    name: Shadow Oracle (differential test)
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: shadow/oracle differential テスト
        run: |
          echo "=== Shadow Oracle: selfhost vs Rust コンパイラ出力比較 ==="
          # selfhost モジュールの Wasm バイナリを生成して比較
          PASS=0
          FAIL=0
          for module in Token AST IR Type; do
            echo "--- ${module} ---"
            if cargo run -- compile selfhost/${module}.ls -o /tmp/shadow_${module}.wasm 2>/dev/null; then
              echo "PASS: ${module} コンパイル成功"
              PASS=$((PASS + 1))
            else
              echo "FAIL: ${module} コンパイル失敗"
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "Shadow Oracle 結果: PASS=$PASS, FAIL=$FAIL"
          # allowlist の確認
          if [[ -f tests/differential-allowlist.yaml ]]; then
            echo "differential-allowlist.yaml を確認済み"
          fi
      - name: artifact 保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-oracle-results
          path: /tmp/shadow_*.wasm
          retention-days: 14
          if-no-files-found: ignore
