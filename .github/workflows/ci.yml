name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチ/PR の重複実行をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  lint:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  format:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # P8-9: ブートストラップ CI
  # selfhost モジュールの stage1 コンパイル成功を検証
  bootstrap:
    name: Bootstrap (selfhost)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: selfhost モジュールのコンパイル検証
        run: |
          # Main.ls を除く selfhost モジュールは bootstrap gate として必須化する
          for module in Token AST IR Type TypeScheme Compiler WasmEmit Lexer Parser; do
            echo "=== Compiling selfhost/${module}.ls ==="
            cargo run -- compile selfhost/${module}.ls -o /tmp/${module}.wasm
          done
          echo "Bootstrap check complete."
      - name: selfhost Main.ls の既知 blocker 監視
        continue-on-error: true
        run: |
          echo "=== Compiling selfhost/Main.ls ==="
          cargo run -- compile selfhost/Main.ls -o /tmp/Main.wasm
      - name: stdlib コンパイル監視
        continue-on-error: true
        run: |
          for module in Core Char Debug IO List Map Path Set String Vector Json; do
            echo "=== Compiling stdlib/${module}.ls ==="
            cargo run -- compile stdlib/${module}.ls -o /tmp/stdlib_${module}.wasm
          done
          echo "stdlib monitor complete."

  # 全ジョブの成功を集約するゲートジョブ
  # Branch Protection Rules ではこのジョブだけを required にすればよい
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test, lint, format, bootstrap]
    if: always()
    steps:
      - name: 全ジョブの結果を検証
        run: |
          if [[ "${{ needs.test.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.format.result }}" != "success" ||
                "${{ needs.bootstrap.result }}" != "success" ]]; then
            echo "CI failed: test=${{ needs.test.result }}, lint=${{ needs.lint.result }}, format=${{ needs.format.result }}, bootstrap=${{ needs.bootstrap.result }}"
            exit 1
          fi
          echo "All checks passed."
