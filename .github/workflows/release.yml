name: Release

# v* タグの push で自動リリースをトリガー (OPS-06)
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # テストと lint を最初に実行してリリースの健全性を保証
  verify:
    name: Verify (test + lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  # Tier1 各プラットフォーム向けリリースビルドとアーカイブ作成
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: リリースビルドとアーカイブ作成
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/release.sh
      - name: アーティファクトのアップロード
        uses: actions/upload-artifact@v4
        with:
          name: lsharp-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/lsharp-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
          retention-days: 30
          if-no-files-found: warn

  # 全 Tier1 ビルドを GitHub Release へ公開
  release:
    name: GitHub Release 作成
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: ビルド済みアーティファクトのダウンロード
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: GitHub Release の作成とアーティファクトの添付
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          draft: false
          # バージョン文字列にハイフンが含まれる場合はプレリリース扱い (例: v0.2.0-rc1)
          prerelease: ${{ contains(github.ref_name, '-') }}
