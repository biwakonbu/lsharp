name: Release

# v* タグの push で自動リリースをトリガー (OPS-06)
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # テストと lint を最初に実行してリリースの健全性を保証
  verify:
    name: Verify (test + lint + format)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  # Tier1 各プラットフォーム向けリリースビルドとアーカイブ作成
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: リリースビルドとアーカイブ作成
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/release.sh
      - name: macOS signing / notarization hook
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE }}
        run: |
          archive_name="lsharp-${VERSION}-${TARGET}"
          archive_dir="dist/${archive_name}"
          archive_path="dist/${archive_name}.${ARCHIVE_EXT}"
          notarization_input="dist/${archive_name}-notary.zip"

          if [[ -z "${APPLE_CODESIGN_IDENTITY}" || -z "${APPLE_NOTARY_KEYCHAIN_PROFILE}" ]]; then
            echo "release signing: Apple credential 未設定時は skip"
            exit 0
          fi

          for binary_path in "${archive_dir}/lsharp" "${archive_dir}/lsharp-lsp"; do
            codesign --force --sign "${APPLE_CODESIGN_IDENTITY}" --options runtime --timestamp "${binary_path}"
            codesign --verify --deep --strict "${binary_path}"
            spctl --assess -vv "${binary_path}"
          done

          ditto -c -k --sequesterRsrc --keepParent "${archive_dir}" "${notarization_input}"
          xcrun notarytool submit "${notarization_input}" --keychain-profile "${APPLE_NOTARY_KEYCHAIN_PROFILE}" --wait

          bash scripts/checksum.sh "${archive_dir}" > "${archive_dir}/checksums.txt"
          rm -f "${archive_path}" "${notarization_input}"
          (
            cd dist
            tar czf "${archive_name}.${ARCHIVE_EXT}" "${archive_name}/"
          )
      - name: Windows Authenticode signing hook
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          WINDOWS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_PFX_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            Write-Host "release signing: Windows credential 未設定時は skip"
            exit 0
          }

          $archiveName = "lsharp-$env:VERSION-$env:TARGET"
          $archiveDir = Join-Path "dist" $archiveName
          $archivePath = Join-Path "dist" "$archiveName.zip"
          $certPath = Join-Path $env:RUNNER_TEMP "lsharp-signing.pfx"
          $signtoolPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtoolPath) {
            throw "signtool.exe not found"
          }

          Set-Alias signtool $signtoolPath
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_PFX_BASE64))

          foreach ($binaryName in @("lsharp.exe", "lsharp-lsp.exe")) {
            $binaryPath = Join-Path $archiveDir $binaryName
            signtool sign /f $certPath /p $env:WINDOWS_SIGN_CERT_PASSWORD /tr $env:WINDOWS_TIMESTAMP_URL /td sha256 /fd sha256 $binaryPath
            signtool verify /pa $binaryPath
          }

          bash scripts/checksum.sh "$archiveDir" > "$archiveDir/checksums.txt"
          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }
          Compress-Archive -Path $archiveDir -DestinationPath $archivePath -Force
          Remove-Item $certPath -Force
      - name: リリースアーカイブ smoke
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: bash scripts/ci/release-smoke.sh "dist/lsharp-${VERSION}-${TARGET}.${ARCHIVE_EXT}"
      - name: アーティファクトのアップロード
        uses: actions/upload-artifact@v4
        with:
          name: lsharp-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            dist/lsharp-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
            dist/lsharp-${{ github.ref_name }}-${{ matrix.target }}.component.wasm
          retention-days: 30
          if-no-files-found: warn

  # experimental native-only RC。公式 host launcher + embedded guest component 配布は置き換えない。
  experimental-native-rc:
    name: Experimental native-only RC (aarch64-apple-darwin)
    runs-on: macos-14
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: experimental native-only RC artifact の生成
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: aarch64-apple-darwin
        run: |
          artifact_id="${VERSION}-${TARGET}"
          archive_name="experimental-native-rc-${VERSION}-${TARGET}.tar.gz"
          NATIVE_PROXY_ARTIFACT_ID="${artifact_id}" bash scripts/ci/build-native.sh
          bash scripts/ci/native-only-rc-smoke.sh "ci-artifacts/native-proxy/${artifact_id}"
          mkdir -p dist
          tar -C ci-artifacts/native-proxy -czf "dist/${archive_name}" "${artifact_id}"
          cat > dist/experimental-native-rc-notes.txt <<'EOF'
          experimental native-only RC

          This artifact does not replace host launcher + embedded guest component distribution.
          Verified with scripts/ci/native-only-rc-smoke.sh before packaging.
          EOF
          bash scripts/checksum.sh dist > dist/checksums.txt
      - name: experimental native-only RC artifact のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: experimental-native-rc-${{ needs.verify.outputs.version }}-aarch64-apple-darwin
          path: |
            dist/experimental-native-rc-${{ needs.verify.outputs.version }}-aarch64-apple-darwin.tar.gz
            dist/checksums.txt
            dist/experimental-native-rc-notes.txt
          retention-days: 30
          if-no-files-found: error

  # build 済み archive を download し、Rust toolchain 無しで release smoke を再実行
  release-smoke:
    name: Release smoke (downloaded artifacts)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Linux release artifact のダウンロード
        uses: actions/download-artifact@v4
        with:
          name: lsharp-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: dist/
      - name: download 済み Linux release archive の smoke
        shell: bash
        run: |
          archive="dist/lsharp-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "ERROR: Linux release archive not found: $archive" >&2
            exit 1
          fi

          bash scripts/ci/release-smoke.sh "$archive"

  # 全 Tier1 ビルドを GitHub Release へ公開
  release:
    name: GitHub Release 作成
    runs-on: ubuntu-latest
    needs:
      - release-smoke
      - experimental-native-rc
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: ビルド済みアーティファクトのダウンロード
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: release-level checksum asset を生成
        shell: bash
        run: bash scripts/checksum.sh dist > dist/checksums.txt
      - name: GitHub Release の作成とアーティファクトの添付
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          draft: false
          # バージョン文字列にハイフンが含まれる場合はプレリリース扱い (例: v0.2.0-rc1)
          prerelease: ${{ contains(github.ref_name, '-') }}
