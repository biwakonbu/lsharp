name: Release

# stable release は、Mac + Lima で事前生成・検証した immutable input だけを受け取る。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '公開する既存の v* tag'
        required: true
        type: string
      macos_native_bundle_url:
        description: 'aarch64 App.Cli input bundle URL'
        required: true
        type: string
      macos_native_bundle_sha256:
        description: 'aarch64 App.Cli input bundle SHA-256'
        required: true
        type: string
      macos_rollback_archive_url:
        description: 'aarch64 rollback compatibility archive URL'
        required: true
        type: string
      macos_rollback_archive_sha256:
        description: 'aarch64 rollback compatibility archive SHA-256'
        required: true
        type: string
      linux_native_bundle_url:
        description: 'Linux x86_64 App.Cli input bundle URL'
        required: true
        type: string
      linux_native_bundle_sha256:
        description: 'Linux x86_64 App.Cli input bundle SHA-256'
        required: true
        type: string
      linux_rollback_archive_url:
        description: 'Linux x86_64 rollback compatibility archive URL'
        required: true
        type: string
      linux_rollback_archive_sha256:
        description: 'Linux x86_64 rollback compatibility archive SHA-256'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  MAX_RELEASE_INPUT_BYTES: '536870912'

jobs:
  verify:
    name: Verify (test + lint + format)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - id: version
        name: release tag と checkout commit の検証
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *)
              echo "ERROR: release_tag must start with v: ${RELEASE_TAG}" >&2
              exit 1
              ;;
          esac

          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "ERROR: release tag does not resolve to checked out commit" >&2
            exit 1
          fi
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "lsharp-wasm"))')"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "ERROR: release tag must match Cargo package version: tag=${RELEASE_TAG} package=v${package_version}" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  # actual self-regeneration は事前生成側の operator gate。ここでは immutable input を package する。
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            native_bundle_url: ${{ inputs.macos_native_bundle_url }}
            native_bundle_sha256: ${{ inputs.macos_native_bundle_sha256 }}
            rollback_archive_url: ${{ inputs.macos_rollback_archive_url }}
            rollback_archive_sha256: ${{ inputs.macos_rollback_archive_sha256 }}
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            native_bundle_url: ${{ inputs.linux_native_bundle_url }}
            native_bundle_sha256: ${{ inputs.linux_native_bundle_sha256 }}
            rollback_archive_url: ${{ inputs.linux_rollback_archive_url }}
            rollback_archive_sha256: ${{ inputs.linux_rollback_archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: immutable App.Cli bundle と rollback archive の取得・検証
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          NATIVE_BUNDLE_URL: ${{ matrix.native_bundle_url }}
          NATIVE_BUNDLE_SHA256: ${{ matrix.native_bundle_sha256 }}
          ROLLBACK_ARCHIVE_URL: ${{ matrix.rollback_archive_url }}
          ROLLBACK_ARCHIVE_SHA256: ${{ matrix.rollback_archive_sha256 }}
        run: |
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }

          verify_sha256() {
            local path="$1"
            local expected_sha256="$2"
            local actual_sha256
            expected_sha256="$(printf '%s' "${expected_sha256}" | tr '[:upper:]' '[:lower:]')"
            if [[ ! "${expected_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "ERROR: invalid expected SHA-256 for ${path}" >&2
              exit 1
            fi
            actual_sha256="$(hash_file "${path}")"
            if [[ "${actual_sha256}" != "${expected_sha256}" ]]; then
              echo "ERROR: immutable release input SHA-256 mismatch: ${path}" >&2
              exit 1
            fi
          }

          cleanup_release_input_on_failure() {
            local exit_code=$?
            if [[ "${exit_code}" -ne 0 ]]; then
              rm -rf release-input
            fi
          }

          input_dir="release-input/${TARGET}"
          native_bundle="${input_dir}/native-input-bundle.tar.gz"
          rollback_archive="${input_dir}/lsharp-${VERSION}-${TARGET}-host-launcher.tar.gz"
          trap cleanup_release_input_on_failure EXIT
          mkdir -p "${input_dir}/native"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --max-filesize "${MAX_RELEASE_INPUT_BYTES}" \
            --output "${native_bundle}" "${NATIVE_BUNDLE_URL}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --max-filesize "${MAX_RELEASE_INPUT_BYTES}" \
            --output "${rollback_archive}" "${ROLLBACK_ARCHIVE_URL}"
          verify_sha256 "${native_bundle}" "${NATIVE_BUNDLE_SHA256}"
          verify_sha256 "${rollback_archive}" "${ROLLBACK_ARCHIVE_SHA256}"

          for downloaded in "${native_bundle}" "${rollback_archive}"; do
            downloaded_bytes="$(wc -c <"${downloaded}" | tr -d '[:space:]')"
            if (( downloaded_bytes > MAX_RELEASE_INPUT_BYTES )); then
              echo "ERROR: release input exceeds size limit: ${downloaded}" >&2
              exit 1
            fi
          done
          python3 - "${native_bundle}" "${input_dir}/native" "${MAX_RELEASE_INPUT_BYTES}" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          output_dir = pathlib.Path(sys.argv[2])
          limit = int(sys.argv[3])
          allowed = {
              "program.native",
              "manifest.json",
              "smoke-stdout.txt",
              "smoke-stderr.txt",
          }
          total = 0
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              if not {"program.native", "manifest.json"}.issubset(names):
                  raise SystemExit("native input bundle is missing required entries")
              for member in members:
                  if member.name not in allowed or not member.isfile():
                      raise SystemExit(f"unsafe native input bundle entry: {member.name}")
                  total += member.size
                  if total > limit:
                      raise SystemExit("native input bundle expanded size exceeds limit")
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"native input bundle entry cannot be read: {member.name}")
                  (output_dir / member.name).write_bytes(source.read())
          PY
          program="${input_dir}/native/program.native"
          manifest="${input_dir}/native/manifest.json"
          if [[ ! -s "${program}" || ! -s "${manifest}" ]]; then
            echo "ERROR: native input bundle must contain program.native and manifest.json at archive root" >&2
            exit 1
          fi
          chmod 755 "${program}"
          {
            echo "NATIVE_ONLY_PROGRAM=${program}"
            echo "NATIVE_ONLY_PROGRAM_MANIFEST=${manifest}"
            echo "ROLLBACK_COMPATIBILITY_ASSET_PATH=${rollback_archive}"
          } >> "${GITHUB_ENV}"
      - name: native-only release archive の作成
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          NATIVE_ONLY_RELEASE: '1'
        run: bash scripts/release.sh
      - name: macOS signing verify / notarization hook
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE }}
        run: |
          archive_dir="dist/lsharp-${VERSION}-${TARGET}"
          notarization_input="dist/lsharp-${VERSION}-${TARGET}-notary.zip"

          if [[ -z "${APPLE_CODESIGN_IDENTITY}" || -z "${APPLE_NOTARY_KEYCHAIN_PROFILE}" ]]; then
            echo "release signing: Apple credential 未設定時は skip"
            exit 0
          fi

          for binary_path in "${archive_dir}/program.native" "${archive_dir}/lsharp"; do
            codesign --verify --deep --strict "${binary_path}"
            spctl --assess -vv "${binary_path}"
          done
          ditto -c -k --sequesterRsrc --keepParent "${archive_dir}" "${notarization_input}"
          xcrun notarytool submit "${notarization_input}" \
            --keychain-profile "${APPLE_NOTARY_KEYCHAIN_PROFILE}" --wait
          rm -f "${notarization_input}"
      - name: リリースアーカイブ smoke
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          archive="dist/lsharp-${VERSION}-${TARGET}.${ARCHIVE_EXT}"
          rollback_archive="${ROLLBACK_COMPATIBILITY_ASSET_PATH}"
          bash scripts/ci/release-smoke.sh "$archive" "$rollback_archive"
      - name: stable release assets のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: lsharp-${{ needs.verify.outputs.version }}-${{ matrix.target }}
          path: |
            dist/lsharp-${{ needs.verify.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}
            dist/lsharp-${{ needs.verify.outputs.version }}-${{ matrix.target }}-host-launcher.tar.gz
          retention-days: 30
          if-no-files-found: error

  # download 後も target-native runner 上で stable archive と rollback archive を再検証する。
  release-smoke:
    name: Release smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs:
      - verify
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: stable release assets のダウンロード
        uses: actions/download-artifact@v4
        with:
          name: lsharp-${{ needs.verify.outputs.version }}-${{ matrix.target }}
          path: dist/
      - name: download 済み archive の smoke
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          archive="dist/lsharp-${VERSION}-${TARGET}.${ARCHIVE_EXT}"
          rollback_archive="dist/lsharp-${VERSION}-${TARGET}-host-launcher.tar.gz"
          for required in "${archive}" "${rollback_archive}"; do
            if [[ ! -s "${required}" ]]; then
              echo "ERROR: downloaded stable release asset not found: ${required}" >&2
              exit 1
            fi
          done
          bash scripts/ci/release-smoke.sh "$archive" "$rollback_archive"

  release:
    name: GitHub Release 作成
    runs-on: ubuntu-latest
    needs:
      - verify
      - release-smoke
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: smoke 済み stable assets のダウンロード
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: stable asset set の検証
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            for asset in \
              "dist/lsharp-${VERSION}-${target}.tar.gz" \
              "dist/lsharp-${VERSION}-${target}-host-launcher.tar.gz"; do
              if [[ ! -s "${asset}" ]]; then
                echo "ERROR: stable release asset missing: ${asset}" >&2
                exit 1
              fi
            done
          done
      - name: release-level checksum asset を生成
        shell: bash
        run: bash scripts/checksum.sh dist > dist/checksums.txt
      - name: rollback anchor release notes を生成
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cat > release-body.md <<EOF
          ## Rollback anchor

          - Last-known-good tag: ${VERSION}
          - Native-only assets: lsharp-${VERSION}-aarch64-apple-darwin.tar.gz, lsharp-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          - Rollback compatibility assets: lsharp-${VERSION}-aarch64-apple-darwin-host-launcher.tar.gz, lsharp-${VERSION}-x86_64-unknown-linux-gnu-host-launcher.tar.gz
          - Checksums: checksums.txt; target, version, source commit, and rollback SHA-256 are also recorded in each archive manifest.
          EOF
      - name: GitHub Release の作成と stable assets の添付
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.version }}
          body_path: release-body.md
          files: |
            dist/lsharp-${{ needs.verify.outputs.version }}-aarch64-apple-darwin.tar.gz
            dist/lsharp-${{ needs.verify.outputs.version }}-aarch64-apple-darwin-host-launcher.tar.gz
            dist/lsharp-${{ needs.verify.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            dist/lsharp-${{ needs.verify.outputs.version }}-x86_64-unknown-linux-gnu-host-launcher.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
