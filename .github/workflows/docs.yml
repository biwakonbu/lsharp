name: Docs Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book/**'
      - 'stdlib/**'
      - 'crates/lsharp-driver/src/doc_site.rs'
      - 'crates/lsharp-driver/src/api_doc.rs'
      - 'crates/lsharp-tooling/src/api_doc.rs'
      - 'scripts/ci/build-doc-site.sh'
      - '.github/workflows/docs.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book/**'
      - 'stdlib/**'
      - 'crates/lsharp-driver/src/doc_site.rs'
      - 'crates/lsharp-driver/src/api_doc.rs'
      - 'crates/lsharp-tooling/src/api_doc.rs'
      - 'scripts/ci/build-doc-site.sh'
      - '.github/workflows/docs.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build static docs site
        run: bash scripts/ci/build-doc-site.sh _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy docs site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
