[workspace]
resolver = "2"
members = [
    "crates/lsharp-syntax",
    "crates/lsharp-types",
    "crates/lsharp-ir",
    "crates/lsharp-wasm",
    "crates/lsharp-tooling",
    "crates/lsharp-driver",
    "crates/lsharp-docs",
    "crates/lsharp-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# local dev loop の待ち時間を優先する。incremental を切ると 1 ファイル変更でも
# 巨大な e2e compilation unit を丸ごと再ビルドするため、incremental は有効にする。
# 導入時 (d8cd6376) の目的だった disk 圧迫は debuginfo の縮小で肩代わりする。
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"
incremental = true

# 依存 crate (wasmtime / cranelift 等) の debuginfo が target 肥大の主因なので落とす。
[profile.dev.package."*"]
debug = false

[workspace.dependencies]
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
insta = "1"
clap = { version = "4", features = ["derive"] }
wasm-encoder = "0.245"
wasmtime = "29"
wasmtime-wasi = "29"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }
