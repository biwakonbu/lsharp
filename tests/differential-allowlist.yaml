# Differential テスト許可リスト
# selfhost コンパイラと Rust コンパイラの出力差分を許容するケースを定義
#
# 形式:
#   allowlist:
#     - id: 一意な ID
#       category: 差分カテゴリ
#       observation: 観測された差分
#       reason: 差分を許容する理由
#       resolve_condition: allowlist から外せる条件
#       tracking_issue: 追跡先 issue / task
#
# カテゴリ一覧 (7種):
#   normal       - 通常の出力差異 (バイナリサイズ・レイアウト等)
#   parse-error  - パースエラーの差異 (エラーメッセージ形式等)
#   type-error   - 型エラーの差異 (エラーコード・位置情報等)
#   module-import - モジュールインポートの差異 (解決順序等)
#   file-io      - ファイルI/Oの差異 (パス解決・エンコーディング等)
#   macro        - マクロ展開の差異 (展開順序・衛生性等)
#   formatter    - フォーマッタ出力の差異 (空白・改行等)
#
# 空のリスト = 全テストで差異なし (理想状態)
# エントリ追加は差分ゼロ不能時のみ。解消条件と追跡先を必ず記載すること。

allowlist: []
